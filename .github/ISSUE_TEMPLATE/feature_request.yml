name: 功能建议
description: 为 chataxi 提出新功能或改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议!请先描述你要解决的问题,再说你希望的方案。
        chataxi 是运行在 Haminn 里的普通 happ;如果建议依赖新的宿主能力,请一并说明它属于哪个场景。
  - type: textarea
    id: problem
    attributes:
      label: 你想解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望的方案
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 相关范围
      options:
        - 单聊对话
        - 多角色群聊
        - 语音朗读(TTS)
        - 语音输入(ASR)
        - 模型接入与协议适配
        - 角色与场景
        - 上下文与压缩
        - 界面与设置
        - 其他
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue,没有发现重复建议。
          required: true
        - label: 我愿意在需要时提交 Pull Request。
          required: false
