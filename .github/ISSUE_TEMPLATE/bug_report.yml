name: 缺陷报告
description: 报告 chataxi 的问题(对话,群聊,语音,模型接入,角色,设置等)
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈!请尽量把信息填全,方便定位。
        请不要粘贴真实 API Key,访问令牌或未打码的隐私对话内容。
  - type: input
    id: version
    attributes:
      label: chataxi 版本
      description: 见仓库 `haminn.json` 或应用内设置页显示的名称。
      placeholder: "例如 0.7.0"
    validations:
      required: true
  - type: input
    id: haminn-version
    attributes:
      label: Haminn 版本
      placeholder: "例如 1.11.0 (versionCode 80)"
    validations:
      required: true
  - type: input
    id: android-webview
    attributes:
      label: Android 与 WebView 版本
      placeholder: "例如 Android 12,WebView Chrome 83"
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: 相关供应商与模型(如适用)
      description: 只写供应商与模型名即可,不要粘贴密钥。
      placeholder: "例如 OpenAI Responses / 某具体模型名"
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 chataxi,进入……
        2. 点击……
        3. 观察到……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 有报错信息或截图请一并贴上,截图请打码隐私内容。
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 单聊对话
        - 多角色群聊
        - 语音朗读(TTS)
        - 语音输入(ASR)
        - 模型卡与供应商接入
        - 角色与角色模板
        - 上下文压缩
        - 界面与设置
        - 备份
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue,没有发现重复。
          required: true
        - label: 我提交的内容不包含真实 API Key,令牌或未打码的隐私对话。
          required: true
        - label: 如涉及真实模型请求,我已确认自己的凭据与网络环境正常。
          required: false
